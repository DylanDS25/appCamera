<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Camara
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button expand="full" (click)="takePicture()">
    <ion-icon slot="start" name="camera"></ion-icon>
    <ion-label>Tomar foto</ion-label>
  </ion-button>
  <div *ngIf="photo">
    <img [src]="photo" alt="foto" style="width: 100%; height: auto;">
  </div>
</ion-content>
